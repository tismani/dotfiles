# LiteLLM gateway config — consumed by the docker container on a SEPARATE
# machine, NOT by Nix and NOT on halo. Git-pull this file into the container and
# point the container at it as its main config.
#
# model_list mirrors `llamaSwapConfig` in hosts/halo/llm.nix. When you add or
# remove a model there, update model_list here to match, then redeploy the
# container. api_base targets llama-swap on halo over the LAN (10.1.3.246:9292,
# the same address OMP uses); halo's firewall keeps 9292 open for this. Nothing
# needs opening on halo for LiteLLM itself — the gateway runs on the remote host.
# Master key comes from the container env var LITELLM_MASTER_KEY.
model_list:
  - model_name: Qwen3.6-35B-A3B-MTP-GGUF
    litellm_params:
      model: openai/Qwen3.6-35B-A3B-MTP-GGUF
      api_base: http://10.1.3.246:9292/v1
      api_key: none
      allowed_openai_params:
        - reasoning_effort
        - reasoning_format
      timeout: 1800
      reasoning_effort: none
    model_info:
      mode: chat
      max_input_tokens: 262144

  - model_name: Qwen3.8-27B-GGUF
    litellm_params:
      model: openai/Qwen3.8-27B-GGUF
      api_base: http://10.1.3.246:9292/v1
      api_key: none
      allowed_openai_params:
        - reasoning_effort
        - reasoning_format
      timeout: 1800
      reasoning_effort: none
    model_info:
      mode: chat
      max_input_tokens: 262144

  - model_name: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF
    litellm_params:
      model: openai/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF
      api_base: http://10.1.3.246:9292/v1
      api_key: none
      allowed_openai_params:
        - reasoning_effort
        - reasoning_format
      timeout: 1800
      reasoning_effort: none
    model_info:
      mode: chat
      max_input_tokens: 262144

  - model_name: Gemma-4-26B-A4B-it-MTP-GGUF
    litellm_params:
      model: openai/Gemma-4-26B-A4B-it-MTP-GGUF
      api_base: http://10.1.3.246:9292/v1
      api_key: none
      allowed_openai_params:
        - reasoning_effort
        - reasoning_format
      timeout: 1800
      reasoning_effort: none
    model_info:
      mode: chat
      max_input_tokens: 262144

  - model_name: peonist-ai/halogen-qwen3.8-flash-next
    litellm_params:
      model: openai/peonist-ai/halogen-qwen3.8-flash-next
      api_base: http://10.1.3.246:9292/v1
      api_key: none
      allowed_openai_params:
        - reasoning_effort
        - reasoning_format
      timeout: 1800
      # No default reasoning_effort: halogen accepts minimal..xhigh but not
      # "none"; preserve its native default unless the client asks.
    model_info:
      mode: chat
      max_input_tokens: 262144

litellm_settings:
  drop_params: true
  request_timeout: 1800
  num_retries: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

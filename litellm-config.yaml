# LiteLLM gateway config — consumed by the docker container on a SEPARATE
# machine, NOT by Nix and NOT on halo. Git-pull this file into the container and
# point the container at it as its main config.
#
# model_list mirrors `llamaSwapConfig` in hosts/halo/llm.nix. When you add or
# remove a model there, update model_list here to match, then redeploy the
# container. api_base targets llama-swap on halo over the LAN (10.1.3.246:9292,
# the same address OMP uses); halo's firewall keeps 9292 open for this. Nothing
# needs opening on halo for LiteLLM itself — the gateway runs on the remote host.
# Master key comes from the container env var LITELLM_MASTER_KEY.
model_list:
  - model_name: Qwen3.6-35B-A3B-MTP-GGUF
    litellm_params:
      model: openai/Qwen3.6-35B-A3B-MTP-GGUF
      api_base: http://10.1.3.246:9292/v1
      api_key: none
      allowed_openai_params:
        - reasoning_effort
        - reasoning_format
      timeout: 1800
      reasoning_effort: none
    model_info:
      mode: chat
      max_input_tokens: 262144
      # OpenRouter reference price: $0.05/M input, $0.70/M output.
      input_cost_per_token: 0.00000005
      output_cost_per_token: 0.0000007

  - model_name: Qwen3.8-27B-GGUF
    litellm_params:
      model: openai/Qwen3.8-27B-GGUF
      api_base: http://10.1.3.246:9292/v1
      api_key: none
      allowed_openai_params:
        - reasoning_effort
        - reasoning_format
      timeout: 1800
      reasoning_effort: none
    model_info:
      mode: chat
      max_input_tokens: 262144
      # OpenRouter reference price: $0.10/M input, $1.80/M output.
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000018

  - model_name: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF
    litellm_params:
      model: openai/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF
      api_base: http://10.1.3.246:9292/v1
      api_key: none
      allowed_openai_params:
        - reasoning_effort
        - reasoning_format
      timeout: 1800
      reasoning_effort: none
    model_info:
      mode: chat
      max_input_tokens: 262144
      # OpenRouter reference price: $0.065/M input, $0.18/M output.
      input_cost_per_token: 0.000000065
      output_cost_per_token: 0.00000018

  - model_name: Gemma-4-26B-A4B-it-MTP-GGUF
    litellm_params:
      model: openai/Gemma-4-26B-A4B-it-MTP-GGUF
      api_base: http://10.1.3.246:9292/v1
      api_key: none
      allowed_openai_params:
        - reasoning_effort
        - reasoning_format
      timeout: 1800
      reasoning_effort: none
    model_info:
      mode: chat
      max_input_tokens: 262144
      # OpenRouter reference price: $0.042/M input, $0.22/M output.
      input_cost_per_token: 0.000000042
      output_cost_per_token: 0.00000022

  - model_name: peonist-ai/halogen-qwen3.8-flash-next
    litellm_params:
      model: openai/peonist-ai/halogen-qwen3.8-flash-next
      api_base: http://10.1.3.246:9292/v1
      api_key: none
      allowed_openai_params:
        - reasoning_effort
        - reasoning_format
      timeout: 1800
      # No default reasoning_effort: halogen accepts minimal..xhigh but not
      # "none"; preserve its native default unless the client asks.
    model_info:
      mode: chat
      max_input_tokens: 262144
      # Halogen's Qwen3.8 Flash equivalent; OpenRouter reference price:
      # $0.15/M input, $0.47/M output.
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.00000047

litellm_settings:
  drop_params: true
  request_timeout: 1800
  num_retries: 0
  include_cost_in_streaming_usage: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  always_include_stream_usage: true

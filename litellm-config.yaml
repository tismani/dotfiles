# LiteLLM gateway config — consumed by the docker container on a SEPARATE
# machine, NOT by Nix and NOT on halo. Git-pull this file into the container and
# point the container at it as its main config.
#
# model_list covers the routes in `llamaSwapConfig` in hosts/halo/llm.nix.
# `model_name` values are LiteLLM-facing aliases; `litellm_params.model` values
# target the corresponding llama-swap IDs. When you add or remove a model
# there, update model_list here, then redeploy the container. api_base targets
# llama-swap on halo over the LAN (10.1.3.246:9292,
# the same address OMP uses); halo's firewall keeps 9292 open for this. Nothing
# needs opening on halo for LiteLLM itself — the gateway runs on the remote host.
# Master key comes from the container env var LITELLM_MASTER_KEY.
model_list:
  - model_name: llamacpp/Qwen3.6-35B-A3B-MTP-GGUF
    litellm_params:
      model: openai/Qwen3.6-35B-A3B-MTP-GGUF
      api_base: http://10.1.3.246:9292/v1
      api_key: none
      allowed_openai_params:
        - reasoning_effort
        - reasoning_format
      timeout: 1800
      reasoning_effort: none
    model_info:
      mode: chat
      max_input_tokens: 262144
      # OpenRouter reference price: $0.05/M input, $0.70/M output.
      input_cost_per_token: 0.00000005
      output_cost_per_token: 0.0000007

  - model_name: llamacpp/Qwen3.8-27B-GGUF
    litellm_params:
      model: openai/Qwen3.8-27B-GGUF
      api_base: http://10.1.3.246:9292/v1
      api_key: none
      allowed_openai_params:
        - reasoning_effort
        - reasoning_format
      timeout: 1800
      reasoning_effort: none
    model_info:
      mode: chat
      max_input_tokens: 262144
      # OpenRouter reference price: $0.10/M input, $1.80/M output.
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000018

  - model_name: llamacpp/Qwen3.8-27B-TURBO-Fable-Cold-Fusion-MTP-GGUF
    litellm_params:
      model: openai/Qwen3.8-27B-TURBO-Fable-Cold-Fusion-MTP-GGUF
      api_base: http://10.1.3.246:9292/v1
      api_key: none
      allowed_openai_params:
        - reasoning_effort
        - reasoning_format
      timeout: 1800
    model_info:
      mode: chat
      max_input_tokens: 262144

  - model_name: gufo/Qwen3.8-27B-DFlash2
    litellm_params:
      model: openai/gufo/Qwen3.8-27B-DFlash2
      api_base: http://10.1.3.246:9292/v1
      api_key: none
      # Gufo accepts reasoning_effort directly but does not implement
      # LiteLLM's reasoning_format extension.
      allowed_openai_params:
        - reasoning_effort
      timeout: 1800
    model_info:
      mode: chat
      max_input_tokens: 262144
      # Same underlying Qwen3.8 weights as the llama.cpp comparison route.
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000018

  - model_name: gufo/Qwen3.8-Flash-Next-MTP
    litellm_params:

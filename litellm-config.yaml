  - model_name: llamacpp/Qwen3-Embedding-4B-GGUF
    litellm_params:
      model: openai/Qwen3-Embedding-4B-GGUF
      api_base: http://10.1.3.246:9292/v1
      api_key: none
      timeout: 1800
    model_info:
      mode: embedding
      # llama-swap runs 4 slots of 32768 / 4 tokens each.
      max_input_tokens: 8192
      output_vector_size: 2560

litellm_settings:
  drop_params: true
  request_timeout: 1800
  num_retries: 0
  include_cost_in_streaming_usage: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  always_include_stream_usage: true
